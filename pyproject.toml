[project]
name = "njiwa_frappe"
description = "WhatsApp messaging for Frappe and ERPNext, through Njiwa."
authors = [{ name = "UPEO.AI", email = "hello@upeo.ai" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]

# Nothing. Frappe already ships requests, and this app needs nothing else.
# An app that adds dependencies to a bench is an app that can break the other
# apps on it.
dependencies = []

[project.urls]
Homepage = "https://njiwa.upeo.ai"
Documentation = "https://docs.njiwa.upeo.ai"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "njiwa_frappe"

[tool.ruff]
# The same as the rest of this repo, so a file moved between them does not
# reformat itself.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
